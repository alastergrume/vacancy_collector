<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">{{ app_name }}</a>
    <nav class="nav">
      {% set path = request.url.path %}
      <a href="/" class="{{ 'active' if path == '/' }}">Статистика</a>
      <a href="/vacancies" class="{{ 'active' if path.startswith('/vacancies') }}">Вакансии</a>
      <a href="/queries" class="{{ 'active' if path.startswith('/queries') }}">Запросы</a>
      <a href="/runs" class="{{ 'active' if path.startswith('/runs') }}">Запуски</a>
      <a href="/drive" class="{{ 'active' if path.startswith('/drive') }}">Google Диск</a>
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="btn btn-ghost">Выйти</button>
    </form>
  </header>
  {% endif %}

  <main class="container {% block main_class %}{% endblock %}">
    {% if flash %}
    <div class="flash flash-{{ flash.kind }}" role="status">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='js/scripts.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
