{% extends "base.html" %}
{% block title %}Вход — {{ app_name }}{% endblock %}
{% block main_class %}login-page{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>{{ app_name }}</h1>
  <p class="muted">Войдите, чтобы увидеть статистику сбора вакансий.</p>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Логин
      <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Войти</button>
  </form>
</div>
{% endblock %}
